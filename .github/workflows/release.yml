# A tag becomes a release: image, tarball, notes.
#
# Pushing v0.6.0 runs the same checks CI runs, builds the console once, and
# publishes three things from that one build: a multi-architecture image on
# GHCR, a tarball of dist/ for anyone running from source without git, and a
# GitHub release whose notes are the matching section of CHANGELOG.md. The
# installer, the Custom App file and the in-app update check all read what
# this publishes, so nothing here is optional.
#
# The tag has to match package.json. A tag on the wrong commit would publish
# an image that calls itself one version and is another, and the console's
# own update check would then argue with it forever.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # Sigstore keyless signing uses this run's OIDC token as the identity. No
  # long-lived cosign private key lives in the repo; the certificate issued
  # against this token is what the user verifies against.
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: The tag must be the version in package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag says $tag, package.json says $pkg. Bump package.json (npm version $tag --no-git-tag-version), merge, then tag that commit." >&2
            exit 1
          fi

      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx tsc -p tsconfig.server.json --noEmit
      - run: npm test
      - run: npm run build

      - name: Package the build for source installs
        run: |
          tar -czf "eznas-${GITHUB_REF_NAME}.tar.gz" dist package.json package-lock.json README.md CHANGELOG.md LICENSE
          sha256sum "eznas-${GITHUB_REF_NAME}.tar.gz" > "eznas-${GITHUB_REF_NAME}.tar.gz.sha256"

      - name: Release notes from the changelog
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # 0.6.0, 0.6 and latest for a release; a prerelease such as
          # 0.7.0-beta.1 gets only its own tag, so latest stays stable.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=EzNAS
            org.opencontainers.image.description=A beautifully simplified, open-source web UI for TrueNAS.
            org.opencontainers.image.licenses=MIT

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless signing of each tag at the digest the push just produced. The
      # certificate ties the signature to this repository and this workflow
      # file, so a signature from any other source — a mirror, a fork,
      # someone's private key — fails to verify under the identity below.
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Sign the published image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
          # Non-interactive confirmation for the Rekor transparency log entry.
          COSIGN_YES: "true"
        run: |
          for tag in $TAGS; do
            cosign sign "${tag}@${DIGEST}"
          done

      # SPDX because that is what the compliance world asks for and what
      # cosign's spdxjson attestation predicate expects. Generated from the
      # pushed image rather than the source tree, so the SBOM lists what is
      # actually in the layers — build dependencies that never shipped are
      # correctly absent.
      - name: Generate an SBOM for the image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: eznas-${{ github.ref_name }}.sbom.spdx.json
          upload-release-assets: false

      - name: Attest the SBOM to the image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SBOM: eznas-${{ github.ref_name }}.sbom.spdx.json
          COSIGN_YES: "true"
        run: |
          for tag in $TAGS; do
            cosign attest --type spdxjson --predicate "$SBOM" "${tag}@${DIGEST}"
          done

      - uses: softprops/action-gh-release@v3
        with:
          name: EzNAS ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            eznas-${{ github.ref_name }}.tar.gz
            eznas-${{ github.ref_name }}.tar.gz.sha256
            eznas-${{ github.ref_name }}.sbom.spdx.json
