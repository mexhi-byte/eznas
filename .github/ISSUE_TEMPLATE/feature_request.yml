name: Feature request
description: Something the console should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The situation, not the solution. "I cannot tell which drive is failing"
        leads somewhere better than "add a column for SMART status".
    validations: { required: true }

  - type: textarea
    id: today
    attributes:
      label: How do you do it today
      description: Through the TrueNAS interface, over SSH, or not at all?

  - type: textarea
    id: who
    attributes:
      label: Who is it for
      description: >
        This console is aimed at people who own a NAS but do not administer one
        for a living. A feature that only makes sense to someone who already
        knows TrueNAS well may belong in TrueNAS instead.
